<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>T&amp;T Job Digest</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Mono:wght@400;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0b0b0d;
    --panel: #141417;
    --row: #1a1b1f;
    --row-hover: #212227;
    --text: #f2f1ec;
    --muted: #8b8d94;
    --red: #c8102e;
    --amber: #f2a900;
    --border: #2a2b30;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    padding: 32px 16px 64px;
  }
  .wrap { max-width: 760px; margin: 0 auto; }

  header {
    border-bottom: 3px solid var(--red);
    padding-bottom: 20px;
    margin-bottom: 28px;
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    flex-wrap: wrap;
    gap: 8px;
  }
  h1 {
    font-family: 'Archivo Black', sans-serif;
    font-size: clamp(24px, 5vw, 34px);
    letter-spacing: 0.5px;
    margin: 0;
    line-height: 1.1;
  }
  h1 span { color: var(--amber); }
  .timestamp {
    font-family: 'Space Mono', monospace;
    font-size: 13px;
    color: var(--muted);
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--red);
    animation: pulse 2s infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.35; }
  }

  .panel { margin-bottom: 32px; }
  .panel-title {
    font-family: 'Space Mono', monospace;
    font-size: 13px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--muted);
    margin: 0 0 10px 2px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .panel-title.tech { color: var(--amber); }
  .board {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
  }

  .row {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 14px 16px;
    text-decoration: none;
    color: var(--text);
    border-bottom: 1px solid var(--border);
    background: var(--row);
    transition: background 0.15s ease;
    opacity: 0;
    animation: flap 0.4s ease forwards;
  }
  .row:last-child { border-bottom: none; }
  .row:hover { background: var(--row-hover); }
  .row:nth-child(1) { animation-delay: 0.02s; }
  .row:nth-child(2) { animation-delay: 0.06s; }
  .row:nth-child(3) { animation-delay: 0.10s; }
  .row:nth-child(4) { animation-delay: 0.14s; }
  .row:nth-child(5) { animation-delay: 0.18s; }
  .row:nth-child(n+6) { animation-delay: 0.20s; }
  @keyframes flap {
    from { opacity: 0; transform: translateY(-6px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @media (prefers-reduced-motion: reduce) {
    .row { animation: none; opacity: 1; }
    .dot { animation: none; }
  }

  .tag {
    font-family: 'Space Mono', monospace;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 1px;
    padding: 4px 7px;
    border-radius: 4px;
    flex-shrink: 0;
  }
  .tag-tech { background: rgba(242,169,0,0.15); color: var(--amber); border: 1px solid rgba(242,169,0,0.4); }
  .tag-gen { background: rgba(255,255,255,0.06); color: var(--muted); border: 1px solid var(--border); }

  .row-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
  .row-title {
    font-family: 'Space Mono', monospace;
    font-size: 14px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .row-sub { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row-source { font-size: 11px; color: var(--muted); flex-shrink: 0; display: none; }
  .row-arrow { color: var(--muted); flex-shrink: 0; }

  @media (min-width: 520px) {
    .row-source { display: block; }
  }

  .empty {
    padding: 20px 16px;
    color: var(--muted);
    font-family: 'Space Mono', monospace;
    font-size: 13px;
    margin: 0;
  }

  footer {
    margin-top: 36px;
    text-align: center;
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    color: var(--muted);
  }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>T&amp;T JOB<span>DIGEST</span></h1>
      <div class="timestamp"><span class="dot"></span>UPDATED 31 Jul 2026 &middot; 06:11</div>
    </header>

    <div class="panel">
      <p class="panel-title tech">&#9889; Tech &amp; IT positions (0)</p>
      <div class="board">
        <p class="empty">No new tech jobs posted in the last 24 hours.</p>
      </div>
    </div>

    <div class="panel">
      <p class="panel-title">All other positions (0)</p>
      <div class="board">
        <p class="empty">No other listings posted in the last 24 hours.</p>
      </div>
    </div>

    <footer>Auto-generated daily from IslandJobHunt &amp; CaribbeanJobs &middot; Trinidad &amp; Tobago, last 24h</footer>
  </div>
</body>
</html>
