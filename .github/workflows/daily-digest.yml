name: Daily Job Digest

on:
  schedule:
    # Trinidad has no DST, so AST is always UTC-4.
    # 10:00 UTC = 6:00 AM AST
    - cron: "0 10 * * *"
    # 23:00 UTC = 7:00 PM AST
    - cron: "0 23 * * *"
  workflow_dispatch: {}  # lets you trigger it manually from the Actions tab too

permissions:
  contents: write

jobs:
  run-digest:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scraper
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NTFY_TOPIC: ${{ vars.NTFY_TOPIC || 'Brand_New_Jobs_Digest' }}
        run: python main.py

      - name: Commit updated page and archive
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/index.html docs/jobs.json
          git diff --staged --quiet || git commit -m "Update job digest $(date -u +'%Y-%m-%d %H:%M UTC')"
          # The archive is append-only, so rebase onto any concurrent run
          # rather than clobbering it with a force push.
          git pull --rebase --autostash
          git push

      # Netlify normally redeploys off its own GitHub webhook. This is the
      # backstop for when that webhook is missing or has gone quiet: a build
      # hook URL published as the NETLIFY_BUILD_HOOK secret forces the deploy
      # from this side. Skipped silently when the secret isn't set.
      - name: Trigger Netlify deploy
        env:
          # Read through env rather than inline: the secrets context isn't
          # available to a step-level `if`.
          HOOK: ${{ secrets.NETLIFY_BUILD_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "No NETLIFY_BUILD_HOOK set - leaving the deploy to Netlify's own webhook."
            exit 0
          fi
          curl -fsS -X POST -d '{}' "$HOOK"